name: iOS build

# Manual only: start from the Actions tab ("Run workflow") when a build is wanted.
on:
  workflow_dispatch:
    inputs:
      app_group:
        description: "Embed the App Group for the home-screen widget (test the install first)"
        type: boolean
        default: false

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
          DEVELOPER_DIR="$xcode/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version

      - name: Project structure check
        run: python3 ios/scripts/check-project.py

      - name: Core checks
        run: |
          swift run --package-path ios --jobs 2 HealthCoreChecks
          swift run --package-path ios --jobs 2 NativeCoreChecks

      - name: Build unsigned IPA
        run: |
          export PINE_BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          export PINE_COMMIT="${GITHUB_SHA:0:7}"
          export PINE_APP_GROUP="${{ inputs.app_group && '1' || '' }}"
          echo "Pine build $PINE_BUILD_NUMBER ($PINE_COMMIT)"
          bash ios/scripts/build.sh --unsigned-ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pine-unsigned-${{ github.sha }}
          path: |
            ios/build/Pine-unsigned.ipa
            ios/Config/Pine.entitlements
          if-no-files-found: error
          retention-days: 30
